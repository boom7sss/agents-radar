name: Daily Agents Radar

on:
  schedule:
    # 每天 10:30 UTC = 18:30 CST (UTC+8)，避开 DeepSeek 09:00-12:00、14:00-18:00 高峰价
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check temporary scheduled pause
        id: temporary_pause
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TODAY_CST=$(TZ=Asia/Shanghai date +%F)
          case "${EVENT_NAME}:${TODAY_CST}" in
            schedule:2026-08-21|schedule:2026-08-22|schedule:2026-08-23)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Daily digest is temporarily paused for ${TODAY_CST}."
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup pnpm
        if: steps.temporary_pause.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.temporary_pause.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.temporary_pause.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check for existing scheduled digest
        if: steps.temporary_pause.outputs.skip != 'true'
        id: existing_digest
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          if [ "$EVENT_NAME" = "schedule" ] && [ -f "digests/${DATE}/ai-picks.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daily digest for ${DATE} already exists; skipping duplicate scheduled run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily digest
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_THINKING: disabled
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: pnpm manifest

      - name: Commit manifest and feed
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://duanyytop.github.io/agents-radar
        run: pnpm notify

      - name: Send Feishu notification
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://duanyytop.github.io/agents-radar
        run: pnpm notify:feishu

      - name: Close stale issues
        if: steps.temporary_pause.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale
