name: Daily Agents Radar

on:
  schedule:
    # 主触发：10:30 UTC = 18:30 CST (UTC+8)。其余为 GitHub 调度延迟时的低成本备用触发。
    # 晚间备用触发用于应对数小时的调度积压；同日锁和 concurrency 保证最多只有一次会调用 DeepSeek。
    - cron: "30 10 * * *"
    - cron: "17 11 * * *"
    - cron: "13 12 * * *"
    - cron: "11 13 * * *"
    - cron: "37 14 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch:

concurrency:
  group: daily-agents-radar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check scheduled delivery window
        id: schedule_window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TODAY_CST=$(TZ=Asia/Shanghai date +%F)
          HOUR_CST=$(TZ=Asia/Shanghai date +%H)
          echo "date=${TODAY_CST}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HOUR_CST" in
            18|19|20|21|22|23)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled run arrived outside the 18:00-23:59 CST delivery window; skipping."
              ;;
          esac

      - name: Check for existing scheduled digest
        if: steps.schedule_window.outputs.skip != 'true'
        id: existing_digest
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATE_CST: ${{ steps.schedule_window.outputs.date }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ -f "digests/${DATE_CST}/ai-picks.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daily digest for ${DATE_CST} already exists; skipping duplicate scheduled run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_THINKING: disabled
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          DATE_CST: ${{ steps.schedule_window.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            git commit -m "digest: ${DATE_CST} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: pnpm manifest

      - name: Commit manifest and feed
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://duanyytop.github.io/agents-radar
        run: pnpm notify

      - name: Send Feishu notification
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://duanyytop.github.io/agents-radar
        run: pnpm notify:feishu

      - name: Close stale issues
        if: steps.schedule_window.outputs.skip != 'true' && steps.existing_digest.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale
